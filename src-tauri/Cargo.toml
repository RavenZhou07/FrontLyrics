[package]
name = "lyricglass"
version = "0.1.0"
edition = "2021"
description = "A private, typography-first Windows lyrics overlay"
license = "MIT"
default-run = "lyricglass"

[lib]
name = "lyricglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
window-vibrancy = "0.6"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = "0.3"
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
